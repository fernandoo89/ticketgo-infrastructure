###############################################################################
# .github/workflows/web-deploy.yml
# CI/CD: Build Node.js (React/Vue) → S3 Sync → CloudFront Invalidation
#
# Secrets requeridos:
#   AWS_ROLE_ARN           — ARN del IAM Role para OIDC
#   S3_FRONTEND_BUCKET     — Nombre del bucket S3 (output del módulo 07)
#   CLOUDFRONT_DIST_ID     — ID de la distribución CloudFront (output módulo 07)
###############################################################################

name: "Web Frontend Deploy (Node.js → S3 → CloudFront)"

on:
  push:
    branches: [main]
    paths: ["apps/web-frontend/**"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    name: "Build, Sync S3, Invalidate CloudFront"
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: apps/web-frontend

      - name: Build Frontend
        run: npm run build
        working-directory: apps/web-frontend
        env:
          VITE_API_URL: ${{ secrets.API_BASE_URL }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Sync archivos estáticos con cache largo (assets con hash)
          aws s3 sync apps/web-frontend/dist/static/ \
            s3://${{ secrets.S3_FRONTEND_BUCKET }}/static/ \
            --cache-control "max-age=31536000,immutable" \
            --delete

          # Sync HTML con cache corto (siempre actualizar)
          aws s3 sync apps/web-frontend/dist/ \
            s3://${{ secrets.S3_FRONTEND_BUCKET }}/ \
            --exclude "static/*" \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
