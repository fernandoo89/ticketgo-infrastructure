###############################################################################
# .github/workflows/infra-deploy.yml
# CI/CD: Terraform Plan (en PR) + Terraform Apply (en merge a main)
#
# Secrets requeridos en GitHub:
#   AWS_ROLE_ARN        — ARN del IAM Role para OIDC (sin access keys)
#   TF_VAR_db_username  — Usuario maestro de RDS
###############################################################################

name: "Infrastructure Deploy (Terraform)"

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  pull_request:
    branches: [main]
    paths: ["infra/**"]

permissions:
  id-token: write   # Requerido para OIDC con AWS
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "us-east-2"
  WORKING_DIR: "infra/environments/prod"

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC — sin access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="db_username=${{ secrets.TF_VAR_db_username }}" \
            -out=tfplan \
            -input=false \
            -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const output = `## Terraform Plan 📋
            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${plan.substring(0, 60000)}
            \`\`\`
            </details>

            *Pusheado por: @${{ github.actor }}, Acción: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply (solo en main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          terraform apply \
            -var="db_username=${{ secrets.TF_VAR_db_username }}" \
            -auto-approve \
            -input=false \
            tfplan
